version: 2
project_name: snipsnap

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/snipsnap
    ldflags:
      - -s -w
      - -X github.com/yourusername/snipsnap/pkg/fileops.Version={{.Version}}
      - -X github.com/yourusername/snipsnap/pkg/fileops.Commit={{.ShortCommit}}
      - -X github.com/yourusername/snipsnap/pkg/fileops.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'